name: Generate transparent Coffee Beans banner

on:
  push:
    paths:
      - '.github/workflows/generate-transparent-banner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare image tools
        run: python -m pip install --quiet Pillow
      - name: Make image background transparent
        run: |
          python - <<'PY'
          from PIL import Image
          import math
          im = Image.open('assets/coffee-beans-banner.webp').convert('RGBA')
          result = Image.new('RGBA', im.size)
          pixels = []
          for r,g,b,a in im.getdata():
              # Remove the nearly black background while retaining bean texture and lettering.
              peak = max(r,g,b)
              if peak <= 18:
                  pixels.append((0,0,0,0))
              elif peak < 76:
                  opacity = round(255 * (peak - 18) / 58)
                  if opacity <= 0:
                      pixels.append((0,0,0,0))
                  else:
                      k = 255/opacity
                      pixels.append((min(255,round(r*k)),min(255,round(g*k)),min(255,round(b*k)),opacity))
              else:
                  pixels.append((r,g,b,255))
          result.putdata(pixels)
          result.save('assets/coffee-beans-banner-transparent.png',optimize=True)
          print('Generated',result.size)
          PY
      - name: Publish updated image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/coffee-beans-banner-transparent.png
          git commit -m 'docs: generate transparent Coffee Beans banner'
          git push
